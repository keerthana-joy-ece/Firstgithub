<!DOCTYPE html>
<html>
<head>
    <title>Theme Toggle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            padding: 30px;
            transition: 0.3s;
        }

        body.dark-mode {
            background-color: #222;
            color: white;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #settingsDisplay {
            background-color: #f2f2f2;
            color: #000;
            padding: 15px;
            margin-top: 20px;
            width: 400px;
        }

        body.dark-mode #settingsDisplay {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Dark / Light Theme</h2>

    <p>Click the button to change the theme.</p>

    <button id="themeButton">Dark Mode</button>

    <button id="resetButton">Reset Settings</button>

    <h3>Current Settings</h3>

    <pre id="settingsDisplay"></pre>

    <script>
        // Settings object
        let settings = {
            theme: "light",
            fontSize: 16
        };

        // Default JSON string
        const defaultSettingsJSON = '{"theme":"light","fontSize":16}';

        const themeButton = document.getElementById("themeButton");
        const resetButton = document.getElementById("resetButton");
        const settingsDisplay = document.getElementById("settingsDisplay");

        // Display settings as JSON
        function displaySettings() {
            const jsonSettings = JSON.stringify(settings);
            settingsDisplay.textContent = jsonSettings;
        }

        // Apply settings
        function applySettings() {

            document.body.classList.toggle(
                "dark-mode",
                settings.theme === "dark"
            );

            document.body.style.fontSize = settings.fontSize + "px";

            themeButton.textContent =
                settings.theme === "light"
                    ? "Dark Mode"
                    : "Light Mode";

            displaySettings();
        }

        // Toggle theme
        themeButton.addEventListener("click", function() {

            if (settings.theme === "light") {
                settings.theme = "dark";
            } else {
                settings.theme = "light";
            }

            applySettings();
        });

        // Reset settings using JSON.parse()
        resetButton.addEventListener("click", function() {

            settings = JSON.parse(defaultSettingsJSON);

            applySettings();
        });

        // Initial display
        applySettings();
    </script>

</body>
</html>
